<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>To-Do List Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="box">
        <h2>To-Do List</h2>
        <div class="input-container">
            <input type="text" id="inputTugas" placeholder="Tulis tugas...">
            <button id="btnTambah">Tambah</button>
        </div>

        <div class="statistik-container">
            <p>Total Tugas: <span id="totalTugas">0</span></p>
            <p>Tugas Selesai: <span id="tugasSelesai">0</span></p>
            <p>Belum Selesai: <span id="belumSelesai">0</span></p>
        </div>
        <ul id="daftarTugas"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
